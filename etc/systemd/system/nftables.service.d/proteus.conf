# /etc/systemd/system/nftables.service.d/proteus.conf
#
# Debian's nftables.service runs `nft flush ruleset` as its ExecStop, so a
# stock `systemctl restart nftables` leaves the gateway with no firewall until
# the reload finishes, and with none at all if the reload fails. The package's
# try-restart on upgrade does the same. /etc/nftables.conf starts with `flush
# ruleset`, so loading it is already an atomic replace: the kernel commits the
# whole file or keeps the old ruleset. Clearing ExecStop makes a restart exactly
# that load. Stop, and shutdown, now leave the ruleset in place; run
# `nft flush ruleset` yourself if you ever need the box without one.
#
# A full load still empties every set and map, so the helper queues the units
# that refill them after every start and every reload. The '-' prefix: the new
# ruleset is live whether or not the helper succeeds, and the unit's state
# should say so. A failed `nft -f` stops the reload before the helper runs,
# which is right: the old ruleset, and its sets, are still loaded.
#
# ExecStart is Debian's own (`nft -f /etc/nftables.conf`) and is left alone.
[Service]
ExecStop=
ExecStartPost=-/etc/proteus/bin/proteus-nft-repopulate.sh
ExecReload=
ExecReload=/usr/sbin/nft -f /etc/nftables.conf
ExecReload=-/etc/proteus/bin/proteus-nft-repopulate.sh
