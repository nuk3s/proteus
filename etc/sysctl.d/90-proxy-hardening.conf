# Kernel settings the gateway depends on. The installer copies this file to
# /etc/sysctl.d/ and loads it once the ruleset is in; systemd-sysctl loads it
# at every boot. 99-proteus.conf, which the installer writes itself, loads
# after it and wins any key both set (today only ip_forward, 1 in both).
# The installer rewrites this file on every run, so local settings belong in a
# sysctl.d file of their own. One that sorts after this file wins at boot for
# any key both set, while the install leaves this file's value running; the
# installer warns when that happens.

# Routing / forwarding
net.ipv4.ip_forward=1
# rp_filter must be 0 or 2, never 1 (strict). The kernel checks a forwarded
# packet's source with a route lookup made as if the packet had arrived on
# the interface it is being forwarded to. For a tunnel's reply to a client
# that is the client interface, where the lookup ends in routeguard.sh's
# ingress sink (or in main without it), never on the slot veth the reply came
# in on, so strict mode drops every tunnel reply. The kernel uses the higher
# of conf.all and an interface's own value, so all=2 also overrides a 1 set on
# any one interface. tests/sysctl_hardening_test.sh reproduces both in a
# network namespace; gotchas.md explains why the sink must stay a device route.
net.ipv4.conf.all.rp_filter=2
net.ipv4.conf.default.rp_filter=2
# Client IPv6 is never forwarded. routeguard.sh's ingress sink and its
# RFC1918 exemptions are IPv4-only, so with no ruleset loaded this is what
# keeps client IPv6 from being routed. Writing conf.all sets every existing
# interface too. The slot namespaces turn IPv6 forwarding on inside
# themselves; that setting is per namespace.
net.ipv6.conf.all.forwarding=0

# Redirects: accept none, send none. The box's routes are the ones its
# scripts write, and an accepted redirect adds one they did not. Every client
# packet must pass through the box to be tunnelled or dropped, so the box
# never points a client at another next hop.
# ip_forward=1 already makes IPv4 ignore redirects. IPv6 reads
# accept_redirects per interface and never conf.all, and default reaches only
# interfaces created after the load, so the * line is what covers the NICs
# that exist by then. systemd-sysctl applies it at boot and, from its udev
# hook, to each interface added later; `sysctl -p` to the interfaces present.
net.ipv4.conf.all.accept_redirects=0
net.ipv4.conf.default.accept_redirects=0
net.ipv4.conf.all.send_redirects=0
net.ipv4.conf.default.send_redirects=0
net.ipv4.conf.all.accept_source_route=0
net.ipv4.conf.default.accept_source_route=0
net.ipv6.conf.all.accept_redirects=0
net.ipv6.conf.default.accept_redirects=0
net.ipv6.conf.*.accept_redirects=0

# ICMP / spoofing. The first two are kernel defaults, pinned. log_martians
# puts a rate-limited "martian source" line in the kernel log, with the
# interface, for each packet rp_filter drops, so strict mode or a sink that is
# not a device route shows up there as dropped tunnel replies. Normal traffic
# does not trigger it: every reverse lookup finds a unicast route, at worst the
# sink or main's default. The slot blackholes and the catch rule drop without
# logging.
net.ipv4.icmp_echo_ignore_broadcasts=1
net.ipv4.icmp_ignore_bogus_error_responses=1
net.ipv4.conf.all.log_martians=1

# TCP. These act on the box's own sockets (unbound's TCP listener, the web UI,
# ssh), not on forwarded client flows. syncookies is the kernel default,
# pinned; rfc1337 drops RSTs aimed at sockets in TIME-WAIT.
net.ipv4.tcp_syncookies=1
net.ipv4.tcp_rfc1337=1
# Kernel default, pinned. With 1, unbound's socket would take the slot mark of
# a redirected client TCP DNS query and route its answers into the tunnel.
net.ipv4.tcp_fwmark_accept=0

# No net.netfilter.* keys. They exist only once nf_conntrack is loaded, which
# nftables.service does with the ruleset, in no fixed order with
# systemd-sysctl: boot can skip one as a missing key while the installer's
# load sets it, so the value would hold only until the next reboot. Nothing in
# proteus needs one; nf_conntrack_acct=1 only adds byte counts to
# `conntrack -L`.
