# /etc/unbound/unbound.conf.d/proteus-dns.conf
# Dedicated DNS resolver for the proteus gateway.
# Egress is steered via fwmark 0x6 -> table 106 -> ns-dns-6 (a dedicated Proton
# WG tunnel), so DNS queries never hit the mgmt interface and never share a
# tunnel with the rotating client-traffic slots.

server:
    verbosity: 1
    use-syslog: yes

    # No DNSSEC validation, deliberately. We forward to Proton's in-tunnel
    # NetShield resolver, which answers a blocked ad/tracker name with a bare
    # unsigned NXDOMAIN *and* NXDOMAINs the DS query for it — so a validating
    # resolver cannot prove insecure delegation and hands clients SERVFAIL for
    # every blocked name instead of a clean NXDOMAIN (verified with
    # `delv @10.2.0.1 doubleclick.net` -> "broken trust chain"). Dropping the
    # validator is what makes NetShield usable downstream. The trust boundary
    # moves to the tunnel: 10.2.0.1 validates upstream itself (dnssec-failed.org
    # -> SERVFAIL + EDE 6, AD set on signed names) and the query never leaves
    # the encrypted WireGuard path. Clients no longer see the AD bit from us.
    #
    # Do NOT express this as `domain-insecure: "."`. That registers a static
    # trust anchor for the root, collides with the distro's autotrust anchor in
    # unbound.conf.d/root-auto-trust-anchor-file.conf (a Debian package file this
    # repo does not manage), and aborts validator init with "trust anchor for '.'
    # presented twice" -> "failed to init modules". It took client DNS down on
    # 2026-08-06. With the validator dropped the autotrust anchor is simply
    # ignored — no error, no warning — so that file can be left alone.
    module-config: "iterator"

    # Listeners (main ns): LAN clients + loopback.
    interface: 172.16.1.5
    interface: 127.0.0.1

    # Who may ask us.
    access-control: 127.0.0.0/8 allow
    access-control: 172.16.1.0/24 allow
    access-control: 10.0.0.0/24 allow
    access-control: 0.0.0.0/0 refuse

    # Sensible cache + privacy defaults.
    prefetch: yes
    qname-minimisation: yes
    hide-identity: yes
    hide-version: yes
    harden-glue: yes
    use-caps-for-id: no
    edns-buffer-size: 1232

    # Keep short-TTL records cached longer to reduce cold-miss rate. Upstream is
    # ~12ms now (in-tunnel), so this matters far less than it did over Quad9 at
    # ~220ms, but it still absorbs the repeat-lookup churn of a busy LAN.
    cache-min-ttl: 300

    # Serve stale answers while refreshing in the background (RFC 8767). This is
    # also the only cushion for a dns-6 outage: there is deliberately no second
    # upstream (see the forward-zone note), so a record seen in the last day
    # keeps resolving while the tunnel rotates.
    # client-timeout: try a fresh answer first, fall back to stale after 1.8s.
    serve-expired: yes
    serve-expired-ttl: 86400
    serve-expired-client-timeout: 1800

    # Bigger caches for a multi-host gateway (defaults are 4m each).
    msg-cache-size: 64m
    rrset-cache-size: 128m

    # Bind outgoing queries to the main-ns transit IP that feeds ns-dns-6.
    # This pins the source of upstream traffic to the interface that is
    # fwmark-routed to the DNS tunnel — belt-and-braces alongside the mangle
    # rule that stamps mark 0x6 on unbound's packets. Load-bearing: the upstream
    # is now an RFC1918 address, so without this pin a routing fallback would be
    # permitted out the mgmt interface (see the DNS kill-switch in nftables.conf).
    outgoing-interface: 172.31.6.1

    # Do not recurse ourselves — forward everything to Proton's resolver.
    do-not-query-localhost: yes

# Forward to Proton's in-tunnel NetShield resolver over the dns-6 tunnel.
# 10.2.0.1 is the gateway address inside EVERY Proton WireGuard tunnel, so it
# needs no update when rotate-dns.sh moves dns-6 to a different exit. NetShield
# (level set by PROTEUS_NETSHIELD_LEVEL, baked into the tunnel's certificate at
# key registration) filters ads/trackers/malware here — this is the layer that
# actually reaches clients, since client port-53 traffic is redirected to us.
#
# Plain UDP/53, not DoT. The previous Quad9 DoT setup existed for one specific
# reason, kept on record in case anyone points this back at a public resolver:
#   Quad9 rate-limits UDP and ICMP per source IP, and a VPN exit carrying our
#   sustained query volume trips it within the hour — the exit goes completely
#   dark on UDP while TCP/853 keeps working (measured 2026-08-01: 100% UDP+ICMP
#   loss, TCP fine, same exit). Under UDP forwarding that looked like a dead
#   tunnel and drove ~18 rotate-dns/day, each restarting unbound and wiping the
#   cache clients rely on.
# That hazard does not apply to an in-tunnel resolver: the query never leaves
# the WireGuard tunnel, Proton does not rate-limit its own gateway address
# (measured ~100 queries, 0 loss, 11-16ms vs ~120ms mean recursion via Quad9),
# and WG already encrypts the path, so DoT's encryption argument is redundant.
# Anyone switching back to a public resolver must restore BOTH
# forward-tls-upstream AND the validator (module-config above).
#
# Single upstream by design: adding a public resolver as a fallback would
# silently disable NetShield filtering the moment 10.2.0.1 hiccups, which
# defeats the point. serve-expired above plus rotate-dns.sh cover short outages.
forward-zone:
    name: "."
    forward-first: no
    forward-tls-upstream: no
    forward-addr: 10.2.0.1
